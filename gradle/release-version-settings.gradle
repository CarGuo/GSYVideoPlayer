// This guard relies on settings/task-graph checks on every invocation.
if (gradle.startParameter.configurationCacheRequested) {
    throw new GradleException('Recovery release guard requires --no-configuration-cache.')
}
// Settings-time check: fail before resolving project plugins or importing signing keys.
def guardClass = new GroovyClassLoader(getClass().classLoader)
        .parseClass(new File(settingsDir, 'gradle/ReleaseVersionGuard.groovy'))
def committed = new Properties()
new File(settingsDir, 'gradle.properties').withInputStream { committed.load(it) }
def effective = providers.gradleProperty('PROJ_VERSION').orNull
// Environment values are supplied as data, never interpolated into shell commands.
def manual = System.getenv('GSY_RELEASE_VERSION')
def tag = System.getenv('GITHUB_REF_TYPE') == 'tag' ? System.getenv('GITHUB_REF_NAME') : null
def releaseIntent = providers.gradleProperty('releaseIntent').orNull == 'true'
try {
    guardClass.validate(committed.getProperty('PROJ_VERSION'), effective, manual, tag, releaseIntent)
} catch (IllegalArgumentException e) {
    throw new GradleException(e.message, e)
}
// All projects inherit one version, also used by the Nexus plugin's endpoint selection.
gradle.beforeProject { p -> p.version = effective }
gradle.projectsLoaded {
    gradle.rootProject.tasks.register('verifyReleaseGuardTests') {
        group = 'verification'
        description = 'Run offline recovery release-version policy and wiring tests.'
        doLast {
            def binding = new Binding([args: [settingsDir.absolutePath] as String[]])
            new GroovyShell(getClass().classLoader, binding).evaluate(
                    new File(settingsDir, 'gradle/tests/release-version-guard-test.groovy'))
        }
    }
    gradle.rootProject.tasks.register('verifyReleaseVersion') {
        group = 'verification'
        description = 'Verify unpublished FFmpeg5 recovery coordinates without publishing.'
    }
}
gradle.taskGraph.whenReady { graph ->
    def forbidden = graph.allTasks.findAll { task ->
        def typeNames = []
        for (Class type = task.getClass(); type != null; type = type.superclass) {
            typeNames.add(type.name)
        }
        guardClass.forbiddenTask(task.name, typeNames)
    }
    if (!forbidden.empty) {
        throw new GradleException('Unpublished FFmpeg5 recovery: blocked tasks ' +
                forbidden.collect { it.path }.join(', '))
    }
}
