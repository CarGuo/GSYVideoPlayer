apply from: "$rootDir/gradle/lib.gradle"

apply from: "$rootDir/gradle/publish.gradle"
apply from: "$rootDir/gradle/maven-central-publish.gradle"
android {
    namespace 'tv.danmaku.ijk.media.exo2'
}

dependencies {
    api(viewDependencies.media - ["androidx.media3:media3-datasource-rtmp:${mediaVersion}"])

    api("androidx.media3:media3-datasource-rtmp:${mediaVersion}") {
        exclude group: 'io.antmedia', module: 'rtmp-client'
    }
    // 2026-08-19: Keep the 16 KB-compatible RTMP native client in the normal
    // GSY module/publication graph instead of resolving a repository-local AAR.
    api project(":gsyVideoPlayer-rtmp")

    api project(":gsyVideoPlayer-base")
}
